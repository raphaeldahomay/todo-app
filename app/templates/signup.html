
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | todoo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

    <div class="auth-container">

        <a href="{{ url_for('main.main_page') }}" class="auth-logo">
            todoo<span class="accent">.</span>
        </a>

        <div class="auth-card">
            <h2>Create an account</h2>
            <p class="auth-subtitle">Get organized with todoo.</p>

            {% if error %}
                <div class="error-message" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('main.signup') }}">

                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">First name</label>
                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            placeholder="First name"
                            autocomplete="given-name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="last_name">Last name</label>
                        <input
                            type="text"
                            id="last_name"
                            name="last_name"
                            placeholder="Last name"
                            autocomplete="family-name"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Create account
                </button>

            </form>
        </div>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('main.login') }}">Log in</a>
        </p>

    </div>

</body>
</html>
